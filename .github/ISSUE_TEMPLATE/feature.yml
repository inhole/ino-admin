name: 기능 제안
description: 사용자 가치를 만드는 기능 작업을 제안합니다.
title: "[기능] "
labels: ["feature"]
body:
  - type: textarea
    id: user-value
    attributes:
      label: 사용자 가치
      description: 이 기능이 해결하는 사용자 또는 운영상의 문제를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 내용과 제외할 내용을 구분해 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 완료로 판단할 수 있는 검증 가능한 조건을 작성해 주세요.
      placeholder: |-
        - [ ]
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: 테스트 계획
      description: 실행할 자동 또는 수동 검증 방법을 작성해 주세요.
    validations:
      required: true
