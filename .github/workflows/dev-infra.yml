name: Dev Infra CI

on:
  push:
    branches: [dev]
    paths:
      - infra/**
  pull_request:
    branches: [dev]
    paths:
      - infra/**

concurrency:
  group: dev-infra-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config
