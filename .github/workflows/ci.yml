name: Main Integration CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ino_admin
          POSTGRES_USER: ino_admin
          POSTGRES_PASSWORD: ino_admin_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ino_admin -d ino_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Start MinIO
        run: |
          docker run -d --name ino-admin-ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ino_admin \
            -e MINIO_ROOT_PASSWORD=ino_admin_local_password \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs ino-admin-ci-minio
          exit 1
      - run: ./gradlew clean test integrationTest architectureTest
        env:
          APP_FILE_STORAGE_TYPE: s3
          APP_FILE_STORAGE_S3_ENDPOINT: http://localhost:9000
          APP_FILE_STORAGE_S3_REGION: us-east-1
          APP_FILE_STORAGE_S3_BUCKET: ino-admin-ci-files
          APP_FILE_STORAGE_S3_ACCESS_KEY: ino_admin
          APP_FILE_STORAGE_S3_SECRET_KEY: ino_admin_local_password
          APP_FILE_STORAGE_S3_PATH_STYLE_ACCESS: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config
