name: Dev CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: 백엔드 단위 검증
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
      - name: 백엔드 테스트, 아키텍처 및 배포 artifact 소비 검증
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test architectureTest
      - name: 자동 테스트 결과 요약
        if: always()
        run: >-
          node .github/scripts/test-summary.cjs
          --title "백엔드 단위·아키텍처"
          --include "build/test-results/test"
          --include "build/test-results/architectureTest"
          --status "${{ job.status }}"
          --commit "$GITHUB_SHA"

  frontend-unit:
    name: 프론트엔드 단위 검증
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: 프론트엔드 의존성 설치
        run: npm ci
      - name: 린트 검사
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 프론트엔드 테스트
        run: npm test
      - name: 자동 테스트 결과 요약
        if: always()
        run: >-
          node ../../.github/scripts/test-summary.cjs
          --title "프론트엔드 단위"
          --include "test-results/vitest"
          --status "${{ job.status }}"
          --commit "$GITHUB_SHA"
