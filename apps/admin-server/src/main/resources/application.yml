spring:
  application:
    name: ino-admin-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ino_admin?characterEncoding=UTF-8}
    username: ${DB_USERNAME:ino_admin}
    password: ${DB_PASSWORD:ino_admin_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  login-security:
    max-failed-attempts: ${APP_LOGIN_MAX_FAILED_ATTEMPTS:5}
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: ${APP_JWT_ISSUER:ino-admin}
    audience: ${APP_JWT_AUDIENCE:ino-admin-web}
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:30d}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:시스템 관리자}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
