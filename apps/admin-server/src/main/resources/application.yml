spring:
  application:
    name: ino-admin-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ino_admin}
    username: ${DB_USERNAME:ino_admin}
    password: ${DB_PASSWORD:ino_admin_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
